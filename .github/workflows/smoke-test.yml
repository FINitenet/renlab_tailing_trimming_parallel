name: smoke-test

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  profile-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax and version
        run: |
          python -m compileall -q main.py pipeline test/run_smoke_test.py
          python main.py --version
      - name: Run minimal profile test
        run: python test/run_smoke_test.py
